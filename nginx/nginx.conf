worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/json;

    # 5 requests/second per client IP; burst lets a short spike through.
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_status 429;

    # WAF-lite: flag a few obvious request-string patterns.
    map $request_uri $deny_match {
        default 0;
        ~*\.\./           1;
        ~*\.\.%2f         1;
        ~*<script         1;
        ~*%3cscript       1;
        ~*union(%20|\+|%2b|[[:space:]]+)select 1;
    }

    map $uri $is_allowed {
        default 0;
        /health   1;
        ~^/api/   1;
    }

    map $deny_match $deny_event {
        1       denylist;
        default "";
    }

    map $is_allowed $allow_event {
        0       allowlist;
        default "";
    }

    map "$deny_event$allow_event" $pre_event {
        default             "";
        denylist            denylist;
        denylistallowlist   denylist;
        allowlist           allowlist;
    }

    map "$status:$pre_event" $security_event {
        default         ok;
        "~^429"         rate_limit;
        "~^413"         size_limit;
        "403:denylist"  denylist;
        "403:allowlist" allowlist;
    }

    log_format security_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"security_event":"$security_event",'
        '"request_length":$request_length,'
        '"body_bytes_sent":$body_bytes_sent'
        '}';

    access_log /var/log/nginx/security/access.json security_json;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1k;

        error_page 413 /_error_413;
        error_page 429 /_error_429;

        location = /_error_413 {
            internal;
            default_type application/json;
            return 413 '{"error":"payload too large","rule":"size_limit"}\n';
        }

        location = /_error_429 {
            internal;
            default_type application/json;
            return 429 '{"error":"too many requests","rule":"rate_limit"}\n';
        }

        location = /health {
            proxy_pass http://api:5000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            if ($deny_match) {
                return 403 '{"error":"denied","rule":"denylist"}\n';
            }

            limit_req zone=api burst=10 nodelay;

            proxy_pass http://api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 403 '{"error":"not allowed","rule":"allowlist"}\n';
        }
    }
}
